[package]
name = "kuatia-storage"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[dependencies]
kuatia-types = { path = "../kuatia-types" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
paste = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
